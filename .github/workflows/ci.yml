name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Lint
        run: bundle exec standardrb --format progress

  tests:
    # The oldest Spree the gemspec supports and the newest release it allows,
    # each on the oldest supported Ruby and the current one. Gemfile.lock is
    # not committed, so "latest" resolves fresh on every run.
    name: Tests (Spree ${{ matrix.spree || 'latest' }}, Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spree: ['6.0.0', '']
        ruby: ['3.3', '4.0']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: spree_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB: postgres
      DATABASE_URL: postgres://postgres:password@localhost:5432/spree_test
      RAILS_ENV: test
      CI: true
      SPREE_VERSION: ${{ matrix.spree }}
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Show resolved versions
        run: bundle exec ruby -e 'puts "Ruby #{RUBY_VERSION}"; %w[spree spree_core rails].each { |g| puts "#{g} #{Gem.loaded_specs[g]&.version}" }'
      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y libvips
      - name: Create test app
        run: bundle exec rake test_app
      - name: Run specs
        run: bundle exec rspec --format progress
